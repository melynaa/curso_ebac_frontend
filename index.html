<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Validação de números</title>
</head>

<body>

<h2>Validação de Formulário</h2>

<form id="form-numeros">
    <label>Campo A:</label>
    <input type="number" id="campoA" required>

    <br><br>

    <label>Campo B:</label>
    <input type="number" id="campoB" required>

    <br><br>

    <button type="submit">Enviar</button>
</form>

<p id="mensagem"></p>

<script>
const form = document.getElementById('form-numeros')

form.addEventListener('submit', function(e) {
    e.preventDefault()

    const campoA = Number(document.getElementById('campoA').value)
    const campoB = Number(document.getElementById('campoB').value)

    const mensagem = document.getElementById('mensagem')

    if (campoB > campoA) {
        mensagem.textContent = "Formulário válido! B é maior que A."
        mensagem.style.color = "green"
    } else {
        mensagem.textContent = "Formulário inválido! B deve ser maior que A."
        mensagem.style.color = "red"
    }
})
</script>

</body>
</html>
